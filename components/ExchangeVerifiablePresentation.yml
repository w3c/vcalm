openapi: 3.0.0
info:
  version: "1.0.0"
  title: Simple W3C Verifiable Presentation Schema
  description: This specifies a simplified W3C verifiable presentation schema sufficient for the purposes of VCALM.
  license:
    name: W3C Software and Document License
    url: http://www.w3.org/Consortium/Legal/copyright-software.
  contact:
    name: GitHub Source Code
    url: https://github.com/w3c/vcalm
paths:
components:
  schemas:
    ExchangeVerifiablePresentation:
      description: >
        A JSON-LD presentation document that also contains exchange-specific
        data. Used in an exchange as a response to a VPR that requests data
        specific to the exchange that is not contained in the verifiable
        credentials themselves.
      allOf:
        - $ref: "./Presentation.yml#/components/schemas/PresentationDocument"
        - type: object
          properties:
            exchangeData:
              type: object
              additionalProperties: true
              description: >
                A JSON object whose property names and values are defined by the
                cryptosuite or other exchange-specific context that requested
                the data, not by this specification. Each property identifies
                that cryptosuite or context. For example, when an exchange
                offers a credential using the <code>bbs-2023</code> cryptosuite
                with pseudonym support, the object includes a
                <code>bbs-2023</code> property whose value contains the
                commitment information required by that cryptosuite (such as
                <code>featureOption</code> and
                <code>commitment_with_proof</code>). Other cryptosuites, such as
                AnonCreds, and other exchange contexts (for example, zcaps or
                payment authorization) define their own property names and
                value shapes in the same object.
      example:
        {
          "@context":
            [
                "https://www.w3.org/ns/credentials/v2",
                "https://w3id.org/vcalm/v1rc1"
            ],
          "holder": "did:example:123",
          "type": "VerifiablePresentation",
          "exchangeData":
            {
                "bbs-2023":
                  {
                      "featureOption": "pseudonym",
                      "commitment_with_proof": "uU6Qc2R0QHj8exampleCommitmentWithProofValue"
                  }
            },
          "proof":
            {
              "type": "DataIntegrityProof",
              "cryptosuite": "eddsa-rdfc-2022",
              "created": "2026-10-20T12:00:00Z",
              "verificationMethod": "did:example:123#key-1",
              "proofPurpose": "authentication",
              "proofValue": "z3FXQjecWufY46exampleProofValueUAUL5n2Brbx",
            },
        }
