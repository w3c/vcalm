openapi: 3.0.0
info:
  version: "0.0.3-unstable"
  title: VC API
  description: This is an Experimental Open API Specification for the [VC Data Model](https://www.w3.org/TR/vc-data-model/).
  license:
    name: W3C Software and Document License
    url: http://www.w3.org/Consortium/Legal/copyright-software.
  contact:
    name: GitHub Source Code
    url: https://github.com/w3c/vcalm
paths:
components:
  schemas:
    VerifiablePresentationRequest:
      type: object
      description: A Verifiable Presentation Request.
      properties:
        "query":
          type: array
          description: A set of one or more queries sent by the requester.
          items:
            type: object
            properties:
              "type":
                type: array
                description: The type of the query.
                items:
                  type: string
              "credentialQuery":
                type: object
                description: For QueryByExample queries, specifies the credential request details.
                properties:
                  "reason":
                    type: string
                    description: A human-readable explanation for why the credential is being requested.
                  "example":
                    type: object
                    description: An example of the credential being requested.
                  "acceptedIssuers":
                    type: array
                    description: Accepted issuers for the requested credential.
                    items:
                      type: object
                      properties:
                        "issuer":
                          type: string
                  "acceptedCryptosuites":
                    type: array
                    description: Cryptographic proof suites the verifier will accept. Each element SHOULD be an object with a <code>cryptosuite</code> property referencing a Data Integrity cryptosuite name or <code>Ed25519Signature2020</code> for legacy (for backwards compatibility, string values MAY also be used and are to be interpreted as the cryptosuite name). This enables the holder to select an appropriate proof format. This property MAY be used independently of <code>acceptedEnvelopes</code>, which is only applicable to enveloped credentials.
                    items:
                      oneOf:
                        - type: string
                          description: A cryptosuite name (shorthand for an object with cryptosuite).
                          example: ["eddsa-rdfc-2022", "bbs-2023", "ecdsa-sd-2023", "Ed25519Signature2020"]
                        - type: object
                          properties:
                            "cryptosuite":
                              type: string
                              description: The name of the cryptosuite.
                          example: [{"cryptosuite": "eddsa-rdfc-2022"}, {"cryptosuite": "bbs-2023"}, {"cryptosuite": "ecdsa-sd-2023"}, {"cryptosuite": "Ed25519Signature2020"}]
                  "acceptedEnvelopes":
                    type: array
                    description: Envelope formats the verifier will accept. Each element SHOULD be an object with a <code>mediaType</code> property referencing the media type for the envelope (for backwards compatibility, string values MAY also be used and are to be interpreted as the media type). This enables the holder to provide credentials in formats other than the default Data Integrity format. This property MAY be used independently of <code>acceptedCryptosuites</code>, which is only applicable to JSON-LD credentials signed with an acceptable cryptosuite.
                    items:
                      oneOf:
                        - type: string
                          description: A media type string (shorthand for an object with mediaType).
                          example: ["application/jwt", "application/vc+sd-jwt"]
                        - type: object
                          properties:
                            "mediaType":
                              type: string
                              description: The media type of the envelope format.
                          example: [{"mediaType": "application/jwt"}, {"mediaType": "application/vc+sd-jwt"}]
        "challenge":
          type: string
          description: A challenge, intended to prevent replay attacks, provided by the requester that is typically expected to be included in the Verifiable Presentation response.
        "domain":
          type: string
          description: A domain, intended to prevent replay attacks, provided by the requester that is typically expected to be included in the Verifiable Presentation response.
          items:
            type: string
        "acceptedEncryption":
          type: object
          description: >
            Indicates that the holder MAY or MUST encrypt the verifiable
            presentation (and any contained verifiable credentials) to public
            keys provided by the requester. Encrypted responses are expressed
            as an EnvelopedVerifiablePresentation or
            EnvelopedVerifiableCredential whose <code>id</code> is a
            <code>data:</code> URL with media type <code>application/jwt</code>
            carrying a JSON Web Encryption compact serialization (five
            dot-delimited segments).
          required:
            - required
            - jwks
          properties:
            required:
              type: boolean
              description: >
                If <code>true</code>, the holder MUST encrypt the response
                using one of the provided keys. If <code>false</code>, the
                holder MAY send an unencrypted verifiable presentation.
            jwks:
              type: array
              minItems: 1
              description: >
                One or more public JSON Web Keys to which the holder may
                encrypt the response. Private key material MUST NOT be
                included.
              items:
                type: object
                additionalProperties: true
                description: A public JSON Web Key (JWK).
                properties:
                  kty:
                    type: string
                  kid:
                    type: string
                  use:
                    type: string
                  crv:
                    type: string
                  x:
                    type: string
                  y:
                    type: string
        "interact":
          type: array
          description: A list of interaction mechanisms that are supported by the server.
          items:
            type: object
            properties:
              "service":
                type: object
                description: A service that is supported by the server that is capable of receiving a response to the Verifiable Presentation Request.
                properties:
                  "type":
                    type: array
                    description: The type of the service.
                    items:
                      type: string
                  "serviceEndpoint":
                    type: string
                    description: A URL that can be utilized for interacting with the service for the purposes of responding to the Verifiable Presentation Request.
      example:
        {
          "query": [{
            "type": "DIDAuthentication"
          }, {
            "type": "QueryByExample",
            "credentialQuery": {
              "reason": "We need to see your existing University Degree credential.",
              "example": {
                "@context": [
                  "https://www.w3.org/ns/credentials/v2",
                  "https://www.w3.org/ns/credentials/examples/v2"
                ],
                "type": "UniversityDegreeCredential"
              },
              "acceptedCryptosuites": [
                {"cryptosuite": "eddsa-rdfc-2022"},
                {"cryptosuite": "ecdsa-rdfc-2019"},
                {"cryptosuite": "bbs-2023"}
              ],
              "acceptedEnvelopes": [
                {"mediaType": "application/jwt"}
              ]
            }
          }],
          "challenge": "3182bdea-63d9-11ea-b6de-3b7c1404d57f",
          "domain": "edu.example",
          "acceptedEncryption": {
            "required": false,
            "jwks": [{
              "kty": "EC",
              "crv": "P-256",
              "use": "enc",
              "kid": "ex-enc-1",
              "x": "MKBCTNIcKUSDii11ySs3526iDZ8AiTo7Tu6KPAqv7D4",
              "y": "4Etl6SRW2YiLUrN5vfvVHuhp7x8PxltmWWlbbM4IFyM"
            }]
          },
          "interact": {
            "service": [{
              "type": "UnmediatedPresentationService2021",
              "serviceEndpoint": "https://edu.example/workflows/123456/presentations"
            }]
          }
        }
